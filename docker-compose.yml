# ==============================================================
# SecureCore IDS — Docker Compose
# Run both frontend and backend locally with resource limits
# that simulate a cloud environment (AWS EC2 t3.medium)
# ==============================================================

services:
  # ─── PostgreSQL Database ───
  db:
    image: postgres:16-alpine
    container_name: securecore-db
    environment:
      - POSTGRES_USER=securecore
      - POSTGRES_PASSWORD=securecore_pass
      - POSTGRES_DB=securecore
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securecore"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ─── Frontend (Nginx serving React SPA) ───
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000
        VITE_WS_URL: ws://localhost:5000
    container_name: securecore-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    # Simulate cloud instance resource limits
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ─── Backend (Flask + SocketIO + ML) ───
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: securecore-backend
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=docker-dev-secret-change-in-production
      - JWT_SECRET_KEY=docker-dev-jwt-secret-change-in-production
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8080
      - HOST=0.0.0.0
      - PORT=5000
      - LOG_LEVEL=INFO
      - FIREBASE_ENABLED=false
      - ML_MODELS_DIR=/app/models
      # PostgreSQL connection
      - DATABASE_URL=postgresql://securecore:securecore_pass@db:5432/securecore
      # Stress-test overrides (raise limits for load testing)
      - WS_MAX_CONNECTIONS_PER_USER=500
      - WS_CONNECT_RATE_LIMIT=10000
      - WS_MESSAGE_QUEUE_SIZE=5000
      - WS_INFERENCE_WORKERS=8
      - WS_INFERENCE_RATE_OVERRIDE=100000
    volumes:
      # Persist data directory for logs, uploads, etc.
      - backend-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Simulate cloud instance resource limits (t3.medium: 2 vCPU, 4GB)
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4096M

volumes:
  pg-data:
  backend-data:
